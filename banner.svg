<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="82%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="360" fill="#0a0a0f"/>
  <rect width="1000" height="360" fill="url(#glow)"/>

  <!-- logo -->
  <text x="60" y="70" font-family="Arial, sans-serif" font-weight="800" font-size="30" letter-spacing="2">
    <tspan fill="#ffffff">D</tspan><tspan fill="#8B5CF6">V</tspan><tspan fill="#8B5CF6">L</tspan><tspan fill="#ffffff">S</tspan>
  </text>

  <!-- badge -->
  <rect x="60" y="100" width="240" height="34" rx="17" fill="#141420" stroke="#2a2a3a"/>
  <circle cx="80" cy="117" r="4" fill="#8B5CF6"/>
  <text x="94" y="122" font-family="Arial, sans-serif" font-size="14" fill="#b8b8c8">Estúdio digital · Santos, SP</text>

  <!-- headline -->
  <text x="58" y="200" font-family="Arial, sans-serif" font-weight="800" font-size="46" fill="#ffffff">Sites que <tspan fill="#8B5CF6">crescem</tspan></text>
  <text x="58" y="252" font-family="Arial, sans-serif" font-weight="800" font-size="46" fill="#8a8a9a">com o negócio.</text>

  <!-- subtext -->
  <text x="60" y="295" font-family="Arial, sans-serif" font-size="16" fill="#8a8a9a">Design bold, código limpo, entrega em 7 dias.</text>

  <!-- stat circle -->
  <circle cx="870" cy="180" r="90" fill="none" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="870" cy="180" r="65" fill="none" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="870" cy="180" r="40" fill="#15121f"/>
  <text x="870" y="188" font-family="Arial, sans-serif" font-weight="800" font-size="24" fill="#8B5CF6" text-anchor="middle">95+</text>
</svg>
